# ─────────────────────────────────────────────────────────────────────────────
# Candylandia Store — nginx del contenedor del front.
#
# OJO con la cadena completa, que tiene dos nginx y es fácil confundirlos:
#
#   internet ──► nginx del HOST (:80/:443, certificados)
#             ──► 127.0.0.1:8520  (lo que publica docker-compose)
#             ──► ESTE nginx (:1515 dentro del contenedor)
#             ──► backend:8000    (FastAPI) para /api, /media y /healthz
#
# Este de aquí no sabe nada de HTTPS ni de dominios: eso es cosa del de fuera.
# Lo suyo es servir el SPA y pasarle al backend lo que no es del SPA.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 1515;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El tamaño lo manda la subida de fotos del panel: el backend rechaza por
    # encima de 8 MB, así que aquí dejamos un poco de aire para que el error
    # que vea quien sube sea el del backend (en castellano) y no un 413 seco
    # de nginx.
    client_max_body_size 12m;

    # Compresión de lo que se sirve desde aquí. Las imágenes ya vienen en
    # WebP, comprimirlas otra vez solo gastaría CPU.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # No anunciar la versión de nginx: no arregla nada por sí solo, pero
    # tampoco hay razón para regalar el dato.
    server_tokens off;

    # ── API ─────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # El esquema real lo sabe el nginx del host; aquí se reenvía tal cual
        # llegó para que FastAPI no crea que todo el mundo entra por http.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # Subir una foto grande con una conexión mala puede tardar; 120 s es
        # lo mismo que aguanta gunicorn del otro lado.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # ── Fotos de los productos ──────────────────────────────────────────────
    # Las sirve FastAPI desde el volumen de medios. Podrían servirse desde
    # aquí montando el volumen también en este contenedor, pero entonces
    # habría dos sitios que arreglar cada vez que cambie la ruta.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Las fotos llevan un sufijo aleatorio en el nombre: cambiar la foto
        # cambia la URL, así que se pueden cachear tranquilamente.
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Salud ───────────────────────────────────────────────────────────────
    # `deploy.sh --check` pregunta por aquí. Responde el backend, que además
    # toca la base de datos: si Postgres no contesta, esto da 503 y el script
    # se entera de verdad en vez de ver un 200 optimista.
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Estáticos del SPA ───────────────────────────────────────────────────
    # Vite les pone un hash en el nombre, así que un año de caché es seguro:
    # si el archivo cambia, cambia su nombre.
    location /estaticos/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # El logo, la mascota y demás no llevan hash. Una semana es un término
    # medio razonable: no se piden en cada visita y cambiarlos no obliga a
    # esperar meses.
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── El SPA ──────────────────────────────────────────────────────────────
    # /admin no es una carpeta: es una ruta de react-router. Sin este
    # try_files, entrar directo a /admin (o recargar estando ahí) daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index NO se cachea: es el que apunta a los estáticos con hash, y si
    # se queda pegado en un navegador, ese navegador se queda con la versión
    # vieja del sitio para siempre.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
